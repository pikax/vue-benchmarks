version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      vue-ecosystem:
        patterns:
          - "vue"
          - "@vue/*"
          - "vue-*"
      tooling:
        patterns:
          - "eslint*"
          - "prettier"
          - "typescript"
          - "mocha"
          - "jsdom"
          - "@vue/test-utils"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
