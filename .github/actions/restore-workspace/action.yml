name: Restore workspace
description: >
  Checkout is assumed already done. Restores pnpm/node_modules (cache),
  installs if needed, and downloads prepared fixtures for this OS.

inputs:
  fixtures-artifact:
    description: Artifact name containing the fixtures/ directory
    required: true
  node-modules-cache-key:
    description: Cache key for node_modules (must match build job)
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm

    # Both installs come from the ONE cache the setup job wrote. envs/tnb used
    # to be outside it and was re-installed by every consumer — the same setup
    # cost paid once per job.
    - name: Restore node_modules cache
      id: nm-cache
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          envs/tnb/node_modules
        key: ${{ inputs.node-modules-cache-key }}

    # Only on a cache miss. A hit makes these no-ops that still cost a pnpm
    # start-up each, so skipping them is the point of the shared cache.
    - name: Install dependencies (cache miss only)
      if: steps.nm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install typescript-native-bridge env (cache miss only)
      if: steps.nm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --dir envs/tnb --ignore-workspace --frozen-lockfile || echo "envs/tnb install failed — vue-tsc (TNB) row will be skipped"

    # Guard: a partial cache (restore-key hit from an older lockfile) would leave
    # a tree that imports but resolves the wrong versions, which is worse than a
    # miss because nothing fails loudly.
    - name: Verify workspace is complete
      shell: bash
      run: |
        if [ ! -d node_modules/vue ] || [ ! -d node_modules/.bin ]; then
          echo "node_modules incomplete after restore — installing"
          pnpm install --frozen-lockfile
        fi

    - name: Download prepared fixtures
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.fixtures-artifact }}
        path: fixtures

    - name: Verify fixtures present
      shell: bash
      run: |
        if [ ! -d fixtures ] || [ -z "$(ls -A fixtures 2>/dev/null)" ]; then
          echo "Fixtures artifact empty or missing"
          ls -la fixtures || true
          exit 1
        fi
        echo "Fixtures ready:"
        ls fixtures | head -20
