name: Benchmark

# Full multi-pass benchmarks. MANUAL DISPATCH ONLY — this is the only workflow
# that ever writes README.md / MEMORY.md.
#
# Pattern mirrors rolldown/benchmarks (measure on CI, merge artifacts into the
# README, auto-commit with [skip ci]) with one deliberate divergence: rolldown
# runs its benchmark job on every push and pull request, we do not. Measured on
# a 32-core box: bench 4.2 min, memory 4.8 min, and ide dominated by repeated
# 500-file project loads — hanging that off a pull request would burn runner
# time per review round for numbers nobody reads. Validation on PR / push lives in `test.yml` (harness + confirm,
# a couple of minutes) and publishes nothing.
#
# There is no schedule. A published number should be traceable to a person who
# asked for it, and a weekly cron that silently rewrites the README on a runner
# nobody was watching is the opposite of that.
#
# Setup (install + fixtures) is done once in `build` and reused via
# node_modules cache + fixtures artifact.
#
# LINUX ONLY. Cross-OS rows were never comparable — the report already forbids
# it — so a three-OS matrix bought nothing but three times the runner cost and
# three more sources of variance. One OS, one runner class, one set of numbers.
#
# Two job groups, matching how the harness itself is split: SPEED and MEMORY
# are always separate runs, never the same one.
#
#   bench  — SPEED. Every timing surface in ONE job. MEASURED at 4.2 min on a
#            32-core box with --runs 5: lint 100s, typecheck 76s, format 33s,
#            lsp 25s, component-meta 9s, compile 8s, jsx-compile 2s.
#            All numbers in a
#            report come off the same VM, so no result is ever merged across
#            runners. Runner-to-runner variance is easily larger than the
#            differences being measured, and sharding by surface would have
#            reintroduced exactly that discrepancy. Nothing here samples memory.
#
#   ide    — SPEED, per-operation editor benchmarks. Its own job only because it
#            churns dozens of language-server processes and repeatedly loads a
#            500-file project; folding that into `bench` would put the load
#            beside every compile and format measurement. Everything WITHIN the
#            job is still one runner, so its operations stay comparable to each
#            other — the same-VM rule is intact.
#
#   memory — MEMORY. Every surface again, including the language servers, with
#            resource sampling turned up (nothing is timed, so sampling cost is
#            free) and exact OS high-water marks folded in. Kept apart because a
#            sampler running beside a timer measures its own overhead.
#
# There is no cold job. Every measured run is preceded by a discarded warmup
# pass, because an unwarmed first run costs a JS compiler ~3.2x its steady
# state and a native compiler nothing — ranking on it measures V8 warmup.

on:
  workflow_dispatch:
    inputs:
      fixture_count:
        description: "Primary UNIQUE fixture SFC count"
        required: false
        default: "200"
      bench_runs:
        description: "Measured runs per tool"
        required: false
        default: "5"
      bench_warmups:
        description: "Discarded warmup runs per tool (minimum 1)"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  NM_CACHE_PREFIX: nm-v1
  FIXTURE_COUNT: ${{ github.event.inputs.fixture_count || '200' }}
  BENCH_RUNS: ${{ github.event.inputs.bench_runs || '5' }}
  BENCH_WARMUPS: ${{ github.event.inputs.bench_warmups || '1' }}
  # The IDE suites start a FRESH language server per pass, and the scale suite
  # additionally loads a 500-file project per size per pass, so they do not get
  # the same run count as the in-process throughput surfaces. Measured, not
  # assumed: at --runs 5 the scale suite alone was ~10.8 min.
  IDE_RUNS: "3"
  IDE_SCALE_RUNS: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Build once per OS: native binaries + unique/vapor/repeated fixtures
  # ---------------------------------------------------------------------------
  build:
    name: Build (Linux)
    runs-on: ubuntu-latest
    # Install + fixture generation. Bounded like everything else: an unbounded
    # job inherits GitHub's 6-hour default, so a hung install burns an
    # afternoon instead of failing a check.
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies (pulls native binaries)
        run: pnpm install --frozen-lockfile

      # Isolated vue-tsc-on-tsgo env, installed HERE so every consumer restores
      # it instead of installing it again. Deliberately a separate project and
      # never a root `typescript` override — an override would swap the engine
      # under component-meta, lint and LSP too.
      - name: Install typescript-native-bridge env (envs/tnb)
        run: pnpm install --dir envs/tnb --ignore-workspace --frozen-lockfile || echo "envs/tnb install failed — vue-tsc (TNB) row will be skipped"

      # ONE cache covering both installs. envs/tnb used to sit outside the cache,
      # so each of bench/ide/memory re-installed it — the same setup paid three
      # times. Its lockfile is part of the key so a change to either invalidates.
      - name: Cache node_modules for bench jobs
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            envs/tnb/node_modules
          key: ${{ env.NM_CACHE_PREFIX }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'envs/tnb/pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.NM_CACHE_PREFIX }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'envs/tnb/pnpm-lock.yaml', '.node-version') }}-

      - name: Generate fixtures (unique + vapor + repeated demo)
        run: |
          COUNT="${{ env.FIXTURE_COUNT }}"
          node scripts/generate.mjs --counts "50,${COUNT}"

      - name: Upload fixtures artifact
        uses: actions/upload-artifact@v7
        with:
          name: fixtures-bench-linux
          path: fixtures
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # BENCH — EVERY surface, one job per OS. All numbers in a report come off the
  # same VM.
  #
  # Splitting by surface would shave some wall time (lint 100s and typecheck 76s
  # are the two biggest; LSP is only 25s now that Volar no longer times out
  # 6 x 60s per run — the old "~376s and dominates" note predated that fix),
  # but it puts each surface on a different runner, and GitHub runners vary
  # enough that two reports merged from two VMs are not one measurement. Keeping
  # everything on one box removes that discrepancy entirely and means a
  # comparison class can never accidentally span machines as surfaces evolve.
  # 4.2 min measured is a fine price for a benchmark somebody asked for.
  #
  # Surface ORDER matters: lsp runs last. Not because it is the longest — it is
  # ~25s against lint's ~100s — but because it spawns and tears down language
  # servers repeatedly, and its hover retries heat the box. Running it first
  # would leave every later surface measuring a warmer, more throttled machine.
  #
  # Every measured run is preceded by a discarded warmup pass (enforced by the
  # harness); there is no separate cold job because an unwarmed run measures
  # JIT warmup for JS tools and nothing for native tools.
  # ---------------------------------------------------------------------------
  bench:
    name: Bench (Linux)
    needs: build
    runs-on: ubuntu-latest
    # MEASURED 4.2 min on a 32-core box at --runs 5. 10 allows ~2.4x for a
    # slower 2-core CI runner. If a run ever approaches this, cut --runs
    # before raising the ceiling: a ceiling that merely accommodates the
    # runtime tells you nothing.
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/restore-workspace
        with:
          fixtures-artifact: fixtures-bench-linux
          node-modules-cache-key: ${{ env.NM_CACHE_PREFIX }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'envs/tnb/pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}

      - name: Measured pass (warmups + measured runs)
        env:
          RUNNER_OS: ${{ runner.os }}
          BENCH_PHASE: bench
        run: |
          COUNT="${{ env.FIXTURE_COUNT }}"
          RUNS="${{ env.BENCH_RUNS }}"
          WARMS="${{ env.BENCH_WARMUPS }}"
          CHECK_LIMIT=$(( COUNT < 200 ? COUNT : 200 ))
          node scripts/bench.mjs \
            --fixture "fixtures/${COUNT}" \
            --surfaces compile,jsx-compile,typecheck,format,lint,component-meta,lsp \
            --compile-targets vdom,vapor \
            --compile-envs production,development \
            --compile-sourcemaps off \
            --runs "$RUNS" \
            --warmups "$WARMS" \
            --check-file-limit "$CHECK_LIMIT" \
            --meta-file-limit 100 \
            --json "results/bench-${{ runner.os }}-${COUNT}-bench.json" \
            --out "results/bench-${{ runner.os }}-${COUNT}-bench.md"

      - name: Compile cache-demo on REPEATED corpus (not for ranking)
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          COUNT="${{ env.FIXTURE_COUNT }}"
          node scripts/bench.mjs \
            --fixture "fixtures/${COUNT}-repeated" \
            --surfaces compile \
            --compile-targets vdom \
            --compile-envs production \
            --compile-sourcemaps off \
            --runs 2 \
            --json "results/bench-${{ runner.os }}-${COUNT}-repeated-cache-demo.json" \
            --out "results/bench-${{ runner.os }}-${COUNT}-repeated-cache-demo.md" || true

      - name: Upload bench results
        id: upload-bench
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-bench-linux
          path: results/**
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # IDE — per-operation editor benchmarks. SPEED group, but its own job.
  #
  # Separate from `bench` for one reason: it starts and stops dozens of language
  # server processes and the scale suite loads a 500-file project several times
  # over, so folding it into `bench` would put that load beside every compile
  # and format measurement on the same box. Everything WITHIN this job stays on
  # one runner, so operations remain comparable to each other — the rule is
  # unchanged, it is the surrounding noise that is being kept out.
  #
  # Nothing here samples memory; that is the `memory` job's business.
  # ---------------------------------------------------------------------------
  ide:
    name: IDE ops (Linux)
    needs: build
    runs-on: ubuntu-latest
    # MEASURED at --runs 5: background 36s, completion 48s, edit-loop 208s,
    # navigation 28s — ~5.4 min, and ~3.2 min at the --runs 3 used here. 10
    # allows ~3x for a slower runner.
    #
    # The `scale` suite is NOT in this job; see `ide-scale`.
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/restore-workspace
        with:
          fixtures-artifact: fixtures-bench-linux
          node-modules-cache-key: ${{ env.NM_CACHE_PREFIX }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'envs/tnb/pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}

      - name: IDE latency suites (all servers)
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          node scripts/ide-bench.mjs \
            --suite background,completion,edit-loop,navigation,smoke \
            --server all \
            --runs "${{ env.IDE_RUNS }}" \
            --warmups "${{ env.BENCH_WARMUPS }}" \
            --json "results/ide-${{ runner.os }}.json" \
            --out "results/ide-${{ runner.os }}.md"

      - name: Upload IDE results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-ide-linux
          path: results/ide-*
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # IDE-SCALE — the scale suite alone: 20 / 100 / 500 files x 4 servers.
  #
  # Split out because it is the single most expensive thing here — a full
  # project load per size per server per pass — and at --runs 5 it was ~10.8 min
  # on a 32-core box, more than the whole rest of the IDE work put together.
  #
  # Splitting it does NOT span a comparison. Every figure the scale suite
  # publishes is a ratio WITHIN itself (the same server at 20 vs 500 files), so
  # a separate runner changes the baseline for every one of its rows equally.
  # That is the same test applied to e2e: sharding by workspace is fine, sharding
  # by extension is not, because the latter would put two compared tools on
  # different VMs.
  # ---------------------------------------------------------------------------
  ide-scale:
    name: IDE scale (Linux)
    needs: build
    runs-on: ubuntu-latest
    # MEASURED 3.6 min at 2 passes on a 32-core box, after the load budget went
    # to 30s and larger sizes stopped being retried once a server fails
    # time-to-usable. 10 allows ~2.7x for a slower runner.
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/restore-workspace
        with:
          fixtures-artifact: fixtures-bench-linux
          node-modules-cache-key: ${{ env.NM_CACHE_PREFIX }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'envs/tnb/pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}

      - name: IDE scale suite (all servers)
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          node scripts/ide-bench.mjs \
            --suite scale \
            --server all \
            --runs "${{ env.IDE_SCALE_RUNS }}" \
            --warmups "${{ env.BENCH_WARMUPS }}" \
            --json "results/ide-scale-${{ runner.os }}.json" \
            --out "results/ide-scale-${{ runner.os }}.md"

      - name: Upload IDE scale results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-ide-scale-linux
          path: results/ide-scale-*
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # MEMORY — all surfaces incl. LSP. Isolated from the speed job on purpose.
  # ---------------------------------------------------------------------------
  memory:
    name: Memory (Linux, all surfaces)
    needs: build
    runs-on: ubuntu-latest
    # MEASURED 4.8 min on a 32-core box at --samples 3. 10 allows ~2x for CI.
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/restore-workspace
        with:
          fixtures-artifact: fixtures-bench-linux
          node-modules-cache-key: ${{ env.NM_CACHE_PREFIX }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'envs/tnb/pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}

      - name: Resource probe (RSS + alloc + CPU, all surfaces)
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          COUNT="${{ env.FIXTURE_COUNT }}"
          # Prefer full corpus when present; fall back to 50
          FIX="fixtures/${COUNT}"
          if [ ! -d "$FIX" ]; then FIX="fixtures/50"; fi
          # Smaller than full timing set is OK; isolate cost still dominates
          FILE_LIMIT=$(( COUNT < 100 ? COUNT : 100 ))
          node --expose-gc scripts/bench-memory.mjs \
            --fixture "$FIX" \
            --file-limit "$FILE_LIMIT" \
            --check-file-limit "$FILE_LIMIT" \
            --meta-file-limit $(( FILE_LIMIT < 50 ? FILE_LIMIT : 50 )) \
            --samples 3 \
            --compile-targets vdom,vapor \
            --compile-envs production \
            --json "results/memory-linux-${FILE_LIMIT}.json" \
            --out "results/memory-linux-${FILE_LIMIT}.md"

      - name: Upload memory results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-memory-linux
          path: results/memory-*
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # README + MEMORY.md update (rolldown-style). The ONLY publishing job in the
  # repository.
  #
  # Gate, explicitly and not by accident:
  #   - workflow_dispatch only. A fork PR could not obtain `contents: write`
  #     anyway, but "the token would have failed" is not a permission model —
  #     the event is named here so the job cannot start from any other trigger.
  #   - main only.
  #   - at least one measurement job succeeded.
  #
  # `always()` plus an OR over the three results means a partial run still
  # publishes what it has. That is safe now and was not before: both updaters
  # LEAVE A SECTION UNTOUCHED when its artifacts are absent instead of
  # substituting a "no artifacts found" placeholder, so a failed `bench` beside
  # a passing `memory` can no longer erase the published bench tables and
  # auto-commit the erasure.
  # ---------------------------------------------------------------------------
  update-readme:
    name: Update README + MEMORY.md
    needs: [bench, ide, ide-scale, memory]
    runs-on: ubuntu-latest
    # Download artifacts, run two updaters, one commit. Seconds of work.
    timeout-minutes: 10
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (needs.bench.result == 'success' || needs.ide.result == 'success' || needs['ide-scale'].result == 'success' || needs.memory.result == 'success')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all benchmark result artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./results
          pattern: results-*
          merge-multiple: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Update README results section
        run: node scripts/update-readme.mjs --dir ./results

      - name: Update MEMORY.md resource probe section
        run: node scripts/update-memory-readme.mjs --dir ./results

      # `[skip ci]` still earns its keep now that this workflow no longer runs
      # on push: the auto-commit lands on `main` and would otherwise trigger a
      # full `test.yml` run for a docs-only change.
      # EXACTLY ONE commit per publish run, and it is the only commit this repo
      # ever makes automatically. Both updaters run first and this step commits
      # their combined output, so a run publishes bench + ide + memory results
      # as a single reviewable change rather than a trail of partial ones.
      #
      # Do not add a second commit step, and do not move this above either
      # updater: splitting it would produce commits where README and MEMORY.md
      # disagree about which run they came from.
      #
      # The action no-ops when nothing changed, so an idempotent re-run does not
      # create an empty commit.
      - name: Commit results (single commit, skip ci)
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: |
            chore: publish benchmark results [skip ci]

            Single commit carrying every surface measured by this run:
            throughput (compile, jsx-compile, typecheck, format, lint,
            component-meta, lsp), per-operation IDE results, and the memory
            probe. A section with no artifact keeps its previous published
            content rather than being replaced by a placeholder, so a partial
            run never erases results it did not measure.

            fixtures: ${{ env.FIXTURE_COUNT }} SFCs · runs: ${{ env.BENCH_RUNS }} · warmups: ${{ env.BENCH_WARMUPS }}
            bench: ${{ needs.bench.result }} · ide: ${{ needs.ide.result }} · ide-scale: ${{ needs['ide-scale'].result }} · memory: ${{ needs.memory.result }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          file_pattern: README.md MEMORY.md
