name: Test

# Gate that runs on every pull request and every push to `main`:
#
#   tests/harness/run.mjs   — self-tests of the benchmark machinery itself
#                             (measurement protocol, ranking/report rendering,
#                             the planted-bug work gate, corpus preparation,
#                             module wiring). Spawns no compiler, runs no
#                             benchmark, finishes in seconds.
#   tests/confirm/run.mjs   — correctness confirmation suite. Real tools, real
#                             assertions; known upstream bugs are allowlisted in
#                             tests/confirm/known-failures.json, an UNLISTED
#                             failure fails the build. Also writes
#                             docs/typecheck.md (pass/fail + one-shot time/RSS).
#
# Neither suite reads the generated corpora, so there is no `scripts/generate.mjs`
# step and no fixtures artifact: `pnpm install --frozen-lockfile` is the whole
# setup.
#
# On `main` only, a follow-up job commits docs/typecheck.md so the published
# matrix and Time and memory table are Linux CI's, not a laptop run. That is
# the only write this workflow makes. Throughput / MEMORY.md publishing stays
# on `benchmark.yml` (manual dispatch).
#
# LINUX ONLY, like every other workflow here. Platform-specific breakage
# (Windows file locks, .cmd shims, path handling) is not covered by CI.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are pointless; main pushes each get their own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    # harness ~3s; typecheck confirm is one measured CLI spawn per plant×tool
    # (~500 vue-tsc/vize/verter/golar runs plus fallthrough retries). 40 keeps
    # headroom on a slow runner without inheriting the 6-hour default.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both suites exit non-zero on failure and no step is `continue-on-error`,
      # so either one failing fails the job and therefore the build.
      - name: Harness self-tests
        run: node tests/harness/run.mjs

      - name: Confirmation suite (correctness)
        run: node tests/confirm/run.mjs

      # run.mjs writes results/confirm.{md,json} by default. Keep them on a
      # failing run — that report is how you tell a new tool bug from a
      # regression. Never committed; results/ is gitignored.
      - name: Upload confirmation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: confirm-report-linux
          path: |
            results/confirm.md
            results/confirm.json
            docs/typecheck.md
          if-no-files-found: ignore
          retention-days: 7

  # On main, persist the Linux-generated typecheck matrix + time/memory table.
  # PRs already ran confirm above; they do not write the repo (forks have no
  # contents: write). [skip ci] so the docs-only commit does not re-enter this
  # workflow.
  publish-typecheck-doc:
    name: Publish docs/typecheck.md
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download confirmation artifacts
        uses: actions/download-artifact@v8
        with:
          name: confirm-report-linux
          path: ./_confirm

      - name: Install generated typecheck.md
        run: |
          mkdir -p docs
          src=""
          for c in ./_confirm/docs/typecheck.md ./_confirm/typecheck.md; do
            if [ -f "$c" ]; then src="$c"; break; fi
          done
          if [ -z "$src" ]; then
            echo "docs/typecheck.md missing from confirm-report-linux artifact" >&2
            find ./_confirm -type f
            exit 1
          fi
          cp "$src" docs/typecheck.md

      - name: Commit docs/typecheck.md
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: |
            chore: publish typecheck confirmation results [skip ci]

            Linux CI rewrite of docs/typecheck.md from tests/confirm/run.mjs
            (pass/fail matrix + one-shot wall clock / peak RSS).
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          file_pattern: docs/typecheck.md
