name: E2E VS Code

# Heavy: downloads VS Code + optional Nuxt UI clone. Not on every PR.
on:
  workflow_dispatch:
    inputs:
      with_nuxt_ui:
        description: "Clone and benchmark pinned Nuxt UI"
        type: boolean
        default: false
      nuxt_ui_ref:
        description: "Nuxt UI git ref"
        required: false
        default: "v3.1.3"
      vize_extension:
        description: "Vize marketplace id"
        required: false
        default: "ubugeeei.vize"
      verter_extension:
        description: "Verter marketplace id"
        required: false
        default: "verter.verter-vscode"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 10 by default, 20 when the Nuxt UI workspace is requested. Set from a
    # MEASURED run rather than from fear: a full local pass (2 workspaces x 3
    # extensions = 6 sequential Electron launches) took 33.1s end to end —
    # 1.6s setup, then 9.0s / 2.8s / 6.8s / 4.0s and two more inside 8.9s. The
    # old 90-minute ceiling was ~160x the real cost.
    #
    # It was high because `runTests()` had no timeout of its own, so one wedged
    # launch blocked the serial loop until the job was killed. The ceiling was
    # insurance against a hang, not an estimate. Each launch now has its own
    # budget, so a hang costs ONE failed row instead of the whole job — which is
    # what makes a tight ceiling safe rather than merely faster to fail.
    #
    # Budgeted so the ceiling cannot be hit by arithmetic alone:
    #   default   6 launches x 90s = 9 min   + ~1 min setup  <= 10
    #   nuxt-ui   9 launches x 90s = 13.5 min + clone/install <= 20
    # Allowing 4-5x the expected CI cost (assume a 2-core runner is 3-4x a warm
    # local box, so the slowest launch ~36s against a 90s budget).
    timeout-minutes: ${{ (github.event.inputs.with_nuxt_ui == 'true') && 20 || 10 }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # Pulls typescript@5.9 (vue-tsc) + typescript-go / typescript@7.0.2 (verter-tsc tsgo)
        # for any non-E2E jobs that share the lockfile; E2E itself uses marketplace extensions.

      # Linux CI needs xvfb for VS Code
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Cache key suffix, rotated monthly.
      #
      # `actions/cache` only WRITES an entry when the primary key missed, so a
      # constant key freezes the cache at whatever VS Code build happened to be
      # stable the first time it was saved: every later run then re-downloads
      # the newer stable and throws it away at the end of the job. Rotating the
      # key means one run a month misses, warm-starts from `restore-keys`, and
      # saves a refreshed entry. Computed here rather than inline because
      # `github.run_month` (used previously) is not a real context property —
      # it evaluated to empty, fell through to the `v1` literal, and never
      # rotated at all.
      - name: Compute cache period
        id: cache-period
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # The VS Code download is ~100-200MB and was re-fetched on every run, for
      # a build that only changes when stable ships. Cached separately from
      # node_modules because it is invalidated by a different thing entirely.
      - name: Cache VS Code download
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-stable-${{ steps.cache-period.outputs.month }}
          restore-keys: |
            vscode-test-${{ runner.os }}-stable-

      # Marketplace extension installs are three network round-trips that do not
      # change between runs unless the pinned ids change.
      - name: Cache marketplace extensions
        uses: actions/cache@v4
        with:
          path: ~/.vscode/extensions
          key: vscode-exts-${{ runner.os }}-${{ github.event.inputs.vize_extension || 'ubugeeei.vize' }}-${{ github.event.inputs.verter_extension || 'verter.verter-vscode' }}
          restore-keys: |
            vscode-exts-${{ runner.os }}-

      - name: Pre-install marketplace extensions
        env:
          VIZE_EXTENSION_ID: ${{ github.event.inputs.vize_extension || 'ubugeeei.vize' }}
          VERTER_EXTENSION_ID: ${{ github.event.inputs.verter_extension || 'verter.verter-vscode' }}
        run: |
          node scripts/e2e-vscode/install-extensions.mjs \
            --ids "Vue.volar,${VIZE_EXTENSION_ID},${VERTER_EXTENSION_ID}"

      - name: Setup E2E workspaces
        run: |
          if [ "${{ github.event.inputs.with_nuxt_ui || 'false' }}" = "true" ]; then
            node scripts/e2e-vscode/setup-workspaces.mjs --with-nuxt-ui --nuxt-ui-ref "${{ github.event.inputs.nuxt_ui_ref || 'v3.1.3' }}"
          else
            node scripts/e2e-vscode/setup-workspaces.mjs
          fi

      - name: Run VS Code E2E (Volar + Vize + Verter)
        env:
          VIZE_EXTENSION_ID: ${{ github.event.inputs.vize_extension || 'ubugeeei.vize' }}
          VERTER_EXTENSION_ID: ${{ github.event.inputs.verter_extension || 'verter.verter-vscode' }}
        run: |
          WS="regular,monorepo"
          if [ -f fixtures/e2e/nuxt-ui/e2e-probe.json ]; then
            WS="regular,monorepo,nuxt-ui"
          fi
          # `runs-on: ubuntu-latest` is hardcoded, so VS Code always needs xvfb.
          xvfb-run -a node scripts/e2e-vscode/run.mjs \
            --workspaces "$WS" \
            --vize-extension "$VIZE_EXTENSION_ID" \
            --verter-extension "$VERTER_EXTENSION_ID"

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-vscode-linux
          path: results/e2e-vscode/**
          if-no-files-found: warn
