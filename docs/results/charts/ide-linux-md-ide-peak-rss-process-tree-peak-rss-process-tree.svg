<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img" aria-label="Peak RSS (process tree)">
  <title>Peak RSS (process tree) (lower is better)</title>
  <style><![CDATA[
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #111827; }
    .struck { fill-opacity: 0.62; }
    .muted { fill: #6b7280; }
    .onbar { fill: #ffffff; }
    .track { fill: #111827; fill-opacity: 0.06; }
    .grid { stroke: #111827; stroke-opacity: 0.08; }
    .strike { stroke: #111827; stroke-opacity: 0.45; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f9fafb; }
      .muted { fill: #9ca3af; }
      .track { fill: #f9fafb; fill-opacity: 0.08; }
      .grid { stroke: #f9fafb; stroke-opacity: 0.12; }
      .strike { stroke: #f9fafb; }
    }
  ]]></style>
  
  <text class="label" fill="#111827" x="16" y="20" font-size="15" font-weight="600">Peak RSS (process tree)</text>
  <text class="muted" fill="#6b7280" x="16" y="36" font-size="11">lower is better</text>
  
  <line class="grid" x1="248" y1="48" x2="248" y2="200" />
  <text class="muted" fill="#6b7280" x="248" y="220" text-anchor="middle" font-size="11">0.0 MB</text>
  <line class="grid" x1="348.5" y1="48" x2="348.5" y2="200" />
  <text class="muted" fill="#6b7280" x="348.5" y="220" text-anchor="middle" font-size="11">173.3 MB</text>
  <line class="grid" x1="449" y1="48" x2="449" y2="200" />
  <text class="muted" fill="#6b7280" x="449" y="220" text-anchor="middle" font-size="11">346.6 MB</text>
  <line class="grid" x1="549.5" y1="48" x2="549.5" y2="200" />
  <text class="muted" fill="#6b7280" x="549.5" y="220" text-anchor="middle" font-size="11">520.0 MB</text>
  <line class="grid" x1="650" y1="48" x2="650" y2="200" />
  <text class="muted" fill="#6b7280" x="650" y="220" text-anchor="middle" font-size="11">693.3 MB</text>
  <text class="muted" fill="#6b7280" x="16" y="77" font-size="11">1</text>
      <text class="label" fill="#111827" x="36" y="77" font-size="13">Verter</text>
      
      <rect class="track" x="248" y="61" width="402" height="22" rx="5"/>
      <rect x="248" y="61" width="136.9" height="22" rx="5" fill="#e11d48"/>
      <text class="onbar" fill="#ffffff" x="256" y="77" font-size="12" font-weight="600">236.1 MB</text>
  <text class="muted" fill="#6b7280" x="16" y="113" font-size="11">2</text>
      <text class="label" fill="#111827" x="36" y="113" font-size="13">Vize</text>
      
      <rect class="track" x="248" y="97" width="402" height="22" rx="5"/>
      <rect x="248" y="97" width="169.9" height="22" rx="5" fill="#2563eb"/>
      <text class="onbar" fill="#ffffff" x="256" y="113" font-size="12" font-weight="600">293.0 MB</text>
  <text class="muted" fill="#6b7280" x="16" y="149" font-size="11">3</text>
      <text class="label" fill="#111827" x="36" y="149" font-size="13">Volar (JS)</text>
      
      <rect class="track" x="248" y="133" width="402" height="22" rx="5"/>
      <rect x="248" y="133" width="309.9" height="22" rx="5" fill="#42b883"/>
      <text class="onbar" fill="#ffffff" x="256" y="149" font-size="12" font-weight="600">534.4 MB</text>
  <text class="muted" fill="#6b7280" x="16" y="185" font-size="11">4</text>
      <text class="label" fill="#111827" x="36" y="185" font-size="13">Volar (N)</text>
      
      <rect class="track" x="248" y="169" width="402" height="22" rx="5"/>
      <rect x="248" y="169" width="402.0" height="22" rx="5" fill="#42b883"/>
      <text class="onbar" fill="#ffffff" x="256" y="185" font-size="12" font-weight="600">693.3 MB</text>
</svg>
