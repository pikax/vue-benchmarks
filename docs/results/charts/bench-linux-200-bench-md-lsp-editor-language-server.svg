<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img" aria-label="LSP (editor language server)">
  <title>LSP (editor language server) (lower is better)</title>
  <style><![CDATA[
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #111827; }
    .struck { fill-opacity: 0.62; }
    .muted { fill: #6b7280; }
    .onbar { fill: #ffffff; }
    .track { fill: #111827; fill-opacity: 0.06; }
    .grid { stroke: #111827; stroke-opacity: 0.08; }
    .strike { stroke: #111827; stroke-opacity: 0.45; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #f9fafb; }
      .muted { fill: #9ca3af; }
      .track { fill: #f9fafb; fill-opacity: 0.08; }
      .grid { stroke: #f9fafb; stroke-opacity: 0.12; }
      .strike { stroke: #f9fafb; }
    }
  ]]></style>
  
  <text class="label" fill="#111827" x="16" y="20" font-size="15" font-weight="600">LSP (editor language server)</text>
  <text class="muted" fill="#6b7280" x="16" y="36" font-size="11">lower is better</text>
  
  <line class="grid" x1="248" y1="48" x2="248" y2="200" />
  <text class="muted" fill="#6b7280" x="248" y="220" text-anchor="middle" font-size="11">0.0 ms</text>
  <line class="grid" x1="348.5" y1="48" x2="348.5" y2="200" />
  <text class="muted" fill="#6b7280" x="348.5" y="220" text-anchor="middle" font-size="11">305 ms</text>
  <line class="grid" x1="449" y1="48" x2="449" y2="200" />
